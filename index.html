<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>거북이 탈출 대작전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 엑셀 창 하나(제목줄·메뉴·수식줄·격자·시트탭·상태줄)를 폰 세로 크기로. 단일 라이트 테마(엑셀 화면). */
:root{
  --xl-green:#1E6B42;      /* 제목줄, 선택 셀 */
  --xl-green-soft:#E4F0E8;
  --navy:#1F3A68;          /* 버튼·포인트 */
  --navy-soft:#E6EDF8;
  --grid:#D6DAD8;
  --head:#F2F4F3;
  --ink:#1D2733;
  --muted:#5F6B66;
  --note:#FFF6C4;
  --note-line:#D6C266;
  --amber:#8A5A00;
  --amber-soft:#FFF0D2;
  --font:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:#E9EDEA}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:#E9EDEA;color:var(--ink);font-family:var(--font);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  display:flex;justify-content:center}
.app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;background:#fff;border:1px solid #C9D0CC;box-shadow:0 6px 24px rgba(30,60,45,.12);overflow:hidden}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* 제목줄 */
.titlebar{background:var(--xl-green);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:42px}
.titlebar .fname{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snd{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:3px;padding:5px 8px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.snd[aria-pressed="true"]{background:#fff;color:var(--xl-green)}
.snd svg{width:16px;height:16px}

/* 메뉴 */
.menu{display:flex;gap:14px;padding:6px 12px 0;border-bottom:1px solid var(--grid);font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.menu span{padding-bottom:5px}
.menu .on{color:var(--xl-green);font-weight:700;border-bottom:2px solid var(--xl-green)}

/* 수식줄 */
.fbar{display:flex;align-items:stretch;border-bottom:1px solid var(--grid);font-size:13px;min-height:30px}
.namebox{width:52px;flex:none;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--grid);font-variant-numeric:tabular-nums}
.fx{width:30px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-style:italic;border-right:1px solid var(--grid)}
.formula{flex:1;min-width:0;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Consolas,"D2Coding",var(--font)}

/* 격자 */
.gridwrap{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff}
table.grid{width:100%;border-collapse:collapse;table-layout:fixed}
table.grid col.rh{width:30px}
table.grid thead th{position:sticky;top:0;z-index:3;background:var(--head);color:var(--muted);font-weight:400;font-size:12px;height:22px;border:1px solid var(--grid)}
table.grid tbody th{background:var(--head);color:var(--muted);font-weight:400;font-size:12px;border:1px solid var(--grid);font-variant-numeric:tabular-nums}
table.grid td{border:1px solid var(--grid);padding:7px 8px;vertical-align:middle;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;position:relative}
tr.empty td,tr.empty th{height:24px;padding:0}

td.ttl{font-size:21px;font-weight:800;color:var(--xl-green);letter-spacing:-.3px;padding-block:10px;text-wrap:balance}
td.sub{color:var(--muted);font-size:13.5px}
td.lbl{background:var(--xl-green-soft);font-weight:700;color:#24513A;font-size:13px}
td.hdr{background:var(--xl-green-soft);font-weight:700;color:#24513A;text-align:center;font-size:13px}
td.c{text-align:center}
td.small{font-size:12px;color:var(--muted)}
td.btncell{padding:6px}
td.num{text-align:center;font-variant-numeric:tabular-nums}
td.pick{cursor:pointer}
td.pick:hover{background:var(--navy-soft)}
.kpi{font-size:24px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{font-size:13px;color:var(--muted);font-weight:700;margin-left:2px}
.stamps{display:flex;justify-content:space-between;gap:4px;padding:4px 2px 2px}
.stp{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.ring{width:38px;height:38px;max-width:100%;border-radius:50%;border:2px dashed #C9D0CC;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--navy);background:#fff}
.stp.on .ring{border:3px double var(--navy);background:var(--navy-soft);transform:rotate(-8deg)}
.stp.today .ring{box-shadow:0 0 0 2px var(--xl-green-soft)}
.dl{font-size:12px;color:var(--muted)}
.stp.today .dl{color:var(--xl-green);font-weight:800}
.nexthint{font-size:12px;color:var(--muted);margin-left:6px}
td.kicker{text-align:center;font-size:12.5px;color:var(--muted);letter-spacing:.5px;padding-top:14px}
td.cover-ttl{text-align:center;font-size:31px;font-weight:900;color:var(--xl-green);letter-spacing:-.5px;padding:4px 8px 2px;text-wrap:balance}
td.cover-sub{text-align:center;font-size:14px;color:var(--ink);padding-bottom:12px}
td.cover-mini{text-align:center;font-size:13px;font-weight:700;color:var(--navy);background:var(--navy-soft)}
td.cover-mini:empty{background:#fff}
/* PC 화면 */
.ribbon{display:none}
@media (min-width:900px){
  .app{max-width:none}
  .ribbon{display:flex;align-items:stretch;gap:0;padding:6px 6px 4px;border-bottom:1px solid var(--grid);background:#FAFBFA;font-size:12px;color:var(--ink);overflow:hidden;white-space:nowrap}
  .rg{position:relative;display:flex;align-items:center;gap:6px;padding:2px 14px 16px;border-right:1px solid var(--grid)}
  .rlbl{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:11px;color:var(--muted)}
  .rb{border:1px solid #D6DAD8;background:#fff;padding:3px 8px;border-radius:2px}
  .rfont{min-width:96px}
  .rt{display:inline-block;min-width:16px;text-align:center;font-style:normal;text-decoration:none;color:var(--ink)}
  i.rt{font-style:italic} u.rt{text-decoration:underline} b.rt{font-weight:800}
  .rbig{text-align:center;font-size:11.5px;line-height:1.3}
  table.grid.wide{width:auto}
  table.grid.wide col.cw{width:122px}
  table.grid.wide col.cx{width:74px}
  .titlebar .fname{text-align:center}
}
td.hl{background:var(--navy-soft);font-weight:700;color:var(--navy)}
td.sel{outline:2px solid var(--xl-green);outline-offset:-2px}
td.sel::after{content:"";position:absolute;right:-3px;bottom:-3px;width:6px;height:6px;background:var(--xl-green);border:1px solid #fff;z-index:2}
td.cmt::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 8px 8px 0;border-color:transparent var(--navy) transparent transparent}

.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:42px;border-radius:2px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;padding:6px 8px}
.btn.sub{background:#fff;color:var(--navy)}
.btn:active{transform:translateY(1px)}

/* 차트 개체 */
td.chart{padding:8px}
.chartbox{position:relative;border:1px solid #B9C2BD;background:#fff;box-shadow:1px 1px 0 #E1E5E3;padding:6px 6px 2px}
.chartbox .ctitle{font-size:11.5px;color:var(--muted);text-align:center}
svg.turtle{display:block;width:100%;height:150px}
.cap{font-size:12.5px;color:var(--muted);text-align:center;padding:2px 0 4px}

/* 드롭다운·체크 */
select.dd{width:100%;font:inherit;font-size:13.5px;border:1px solid #B9C2BD;border-radius:2px;background:#fff;padding:6px 4px;color:var(--ink)}
.chk{display:flex;justify-content:center}
.chk input{width:20px;height:20px;accent-color:var(--xl-green)}
.chip{display:inline-block;padding:3px 8px;border-radius:2px;font-weight:700;font-size:13px}
.chip.ok{background:var(--xl-green-soft);color:#1E6B35}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:#FBE3BE;color:#6E4300}
.chip.none{background:var(--head);color:var(--muted);font-weight:400}

input.ang{width:100%;accent-color:var(--navy)}

/* 타이머 */
td.cnt{text-align:center;height:92px;padding:4px}
.big{font-size:56px;font-weight:800;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.big.prep{color:#8A96A3;font-size:44px}
.big.txt{font-size:28px;letter-spacing:-.5px}
.unit{font-size:15px;font-weight:700;color:var(--muted);margin-left:3px}
td.st{text-align:center;font-weight:700;color:#24513A;background:var(--xl-green-soft);font-size:14px}
.barwrap{height:16px;background:#F1F3F2;border:1px solid #DDE2DF;position:relative}
.bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3E68B0,#7FA2DC);transition:width .2s linear}
.bar.grey{background:#C3CBD3}
.note{position:absolute;right:6px;top:-30px;z-index:4;max-width:84%;background:var(--note);border:1px solid var(--note-line);box-shadow:2px 2px 0 rgba(0,0,0,.08);padding:5px 9px;font-size:13px;font-weight:700;color:#4A3D00;text-align:left;pointer-events:none}
.note::after{content:"";position:absolute;left:14px;bottom:-7px;width:10px;height:10px;background:var(--note);border-right:1px solid var(--note-line);border-bottom:1px solid var(--note-line);transform:rotate(45deg)}
.note.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.note:empty{display:none}

/* 도장 */
.stamp{position:absolute;left:12px;top:22px;width:104px;height:104px;border:4px double var(--navy);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--navy);font-weight:900;font-size:19px;line-height:1.15;transform:rotate(-12deg);background:rgba(255,255,255,.75);animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both}
.stamp small{font-size:11px;font-weight:700;margin-top:3px}
@keyframes stamp{0%{transform:scale(2.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}

/* 시트 탭 */
.tabbar{display:flex;flex:none;border-top:1px solid var(--grid);background:var(--head)}
.tnav{flex:none;width:32px;border:0;border-right:1px solid var(--grid);background:var(--head);color:var(--muted);font-size:11px;cursor:pointer}
.tnav:hover{background:#fff;color:var(--xl-green)}
.tabs{position:relative;display:flex;align-items:stretch;background:var(--head);overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;scroll-behavior:smooth;cursor:grab}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-right:1px solid var(--grid);background:transparent;color:var(--muted);font-size:12.5px;padding:8px 11px;cursor:pointer;white-space:nowrap}
.tab.on{background:#fff;color:var(--xl-green);font-weight:700;box-shadow:inset 0 -2px 0 var(--xl-green)}
.tab.done{color:#2D7A4A}
.tabs .plus{flex:none;padding:8px 12px;color:var(--muted)}

/* 상태줄 */
.status{display:flex;justify-content:space-between;gap:8px;padding:4px 10px;font-size:11.5px;color:var(--muted);background:#F7F8F7;border-top:1px solid var(--grid);font-variant-numeric:tabular-nums;flex:none}

@media (prefers-reduced-motion:reduce){.stamp,.note.pop{animation:none}.bar{transition:none}}
</style>
</head>
<body>


<div class="app" id="app">
  <div class="titlebar">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="1" width="16" height="16" rx="2" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M1 6.5h16M1 11.5h16M6.5 1v16" stroke="#fff" stroke-width="1.4"/></svg>
    <div class="fname">3분기_업무보고_최종.xlsx</div>
    <button class="snd" id="snd" aria-pressed="false" type="button"></button>
  </div>
  <div class="menu" aria-hidden="true"><span>파일</span><span class="on">홈</span><span>삽입</span><span>수식</span><span>데이터</span><span>검토</span><span>보기</span></div>
  <div class="ribbon" aria-hidden="true">
    <div class="rg"><span class="rbig">📋<br>붙여넣기</span><span class="rlbl">클립보드</span></div>
    <div class="rg"><span class="rb rfont">맑은 고딕 ▾</span><span class="rb">11 ▾</span><b class="rt">가</b><i class="rt">가</i><u class="rt">가</u><span class="rlbl">글꼴</span></div>
    <div class="rg"><span class="rt">≡</span><span class="rt">☰</span><span class="rb">병합하고 가운데 맞춤</span><span class="rlbl">맞춤</span></div>
    <div class="rg"><span class="rb">일반 ▾</span><span class="rt">%</span><span class="rt">,</span><span class="rlbl">표시 형식</span></div>
    <div class="rg"><span class="rb">조건부 서식</span><span class="rb">표 서식</span><span class="rb">셀 스타일</span><span class="rlbl">스타일</span></div>
    <div class="rg"><span class="rb">Σ 자동 합계</span><span class="rb">정렬 및 필터</span><span class="rlbl">편집</span></div>

  <div class="status"><span id="stLeft">준비</span><span id="stRight">진행 0/5 · 100%</span></div>
</div>

<script>
(function(){
"use strict";

/* ===== 동작 (질병관리청 국가건강정보포털 「일자목(거북목)증후군」 기준) ===== */
const MOVES=[
 {key:"tuck", tab:"턱당기기", name:"턱 당기기", meta:"30초 × 2회", sets:2, hold:30,
  formula:"=턱당기기(30초, 2회)", how:"시선은 정면 그대로, 턱을 목 쪽으로 당기면서 머리를 뒤로 쏙 밀어요. 그 자세로 30초 버텨요.",
  point:"고개를 숙이지 않아요! 이중턱이 생기면 잘하고 있는 거예요", basis:"질병관리청 「일자목(거북목)증후군」, 2026년", hint:"← 턱을 뒤로 쏙!"},
 {key:"back", tab:"목뒤", name:"목 뒤 늘리기", meta:"30초", sets:1, hold:30,
  formula:"=목뒤늘리기(30초)", how:"고개를 천천히 앞으로 숙여 목 뒤쪽을 늘려요.",
  point:"가볍게 늘어나는 느낌까지만!", basis:"질병관리청 「일자목(거북목)증후군」, 2026년", hint:"↓ 천천히 숙이기"},
 {key:"front", tab:"목앞", name:"목 앞 늘리기", meta:"30초", sets:1, hold:30,
  formula:"=목앞늘리기(30초)", how:"허리를 펴고 고개를 천천히 뒤로 젖혀 목 앞쪽을 늘려요.",
  point:"아프면 젖히는 각도를 줄여요!", basis:"질병관리청 「일자목(거북목)증후군」, 2026년", hint:"↑ 천천히 젖히기"},
 {key:"blade", tab:"날개뼈", name:"날개뼈 모으기", meta:"30초 × 2회", sets:2, hold:30,
  formula:"=날개뼈모으기(30초, 2회)", how:"가슴을 펴고 양쪽 어깨를 뒤로 당겨, 등 뒤 날개뼈끼리 가까워지게 모아요. 그 자세로 30초 버텨요.",
  point:"어깨가 귀 쪽으로 올라가지 않게!", basis:"질병관리청 「일자목(거북목)증후군」, 2026년", hint:"어깨를 뒤로 쫙!", front:true},
 {key:"roll", tab:"목돌리기", name:"목 천천히 돌리기", meta:"시계 5회 + 반시계 5회", roll:true, reps:5, per:4,
  formula:"=목돌리기(시계 5회, 반시계 5회)", how:"목을 천천히 크게 돌려요. 시계 방향 5번, 반대 방향 5번이에요.",
  point:"빠르게 돌리지 말고 천천히!", basis:"질병관리청 「일자목(거북목)증후군」, 2026년", hint:"", front:true}
];
const PAGES=["cover","intro","log","diag","weight","posture","promise"];
const SHEETS=["표지","소개","기록","자가진단","머리무게","바른자세","약속"].concat(MOVES.map(m=>m.tab)).concat(["자가체크","완료"]);
const FIRST_MOVE=7, DONE_SHEET=SHEETS.length-1, CHECK_SHEET=SHEETS.length-2;
const SRC="출처: 질병관리청 「일자목(거북목)증후군」, 2026년";

const $=id=>document.getElementById(id);
const gridWrap=$("gridWrap"), tabsEl=$("tabs");
let cur=0, run=null, doneMoves=new Set(), sessionStart=0, wakeLock=null;

/* ===== 소리 (코드로 만든 오르골 음악 + 효과음) ===== */
let ctx=null, master=null, musicGain=null, soundOn=false, musicTimer=null, nextNoteTime=0, step=0;
const STEP=0.3125; // 96bpm 8분음표
const MEL=[76,-1,79,-1,81,79,76,-1, 72,-1,76,-1,74,72,69,-1, 72,74,76,-1,81,-1,79,76, 74,-1,79,-1,74,72,74,-1];
const BASS=[48,45,41,43];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function ensureCtx(){
  if(ctx) return true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
    musicGain=ctx.createGain(); musicGain.gain.value=0.5; musicGain.connect(master);
    return true;
  }catch(e){ctx=null;return false}
}
function voice(freq,t,dur,vol,type,dest){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.05);
}
function schedule(){
  if(!ctx) return;
  while(nextNoteTime<ctx.currentTime+0.25){
    const n=MEL[step%MEL.length];
    if(n>0){ voice(mtof(n),nextNoteTime,0.7,0.09,"sine",musicGain); voice(mtof(n+12),nextNoteTime,0.35,0.025,"triangle",musicGain); }

const wideMQ=window.matchMedia?window.matchMedia("(min-width: 900px)"):null;
let WIDE=!!(wideMQ&&wideMQ.matches);
function sheetHTML(rows,total){
  const EX=WIDE?9:0, L="ABCDEFGHIJKLMNOPQRSTUVWXYZ".slice(0,6+EX).split(""), pad="<td></td>".repeat(EX);
  let h='<table class="grid'+(WIDE?" wide":"")+'"><colgroup><col class="rh">'+(WIDE?'<col class="cw">'.repeat(6)+'<col class="cx">'.repeat(EX):'<col>'.repeat(6))+'</colgroup><thead><tr><th></th>'
    +L.map(c=>"<th>"+c+"</th>").join("")+'</tr></thead><tbody>';
  rows.forEach((cells,r)=>{
    h+="<tr><th>"+(r+1)+"</th>"+cells.map(c=>'<td colspan="'+c.s+'"'+(c.c?' class="'+c.c+'"':"")+(c.id?' id="'+c.id+'"':"")+">"+c.h+"</td>").join("")+pad+"</tr>";

  for(let r=rows.length;r<tot;r++) h+='<tr class="empty"><th>'+(r+1)+"</th>"+"<td></td>".repeat(6+EX)+"</tr>";

function renderTabs(){
  tabsEl.innerHTML=SHEETS.map((s,i)=>{
    const isMove=i>=FIRST_MOVE&&i<CHECK_SHEET, done=isMove&&doneMoves.has(i-FIRST_MOVE);
    return '<button class="tab'+(i===cur?" on":"")+(done?" done":"")+'" type="button" role="tab" aria-selected="'+(i===cur)+'" data-i="'+i+'">'+(done?"✓ ":"")+s+"</button>";
  }).join("")+'<span class="plus" aria-hidden="true">+</span>';
  const on=tabsEl.querySelector(".tab.on");
  if(on){ const l=on.offsetLeft, r=l+on.offsetWidth; if(l<tabsEl.scrollLeft) tabsEl.scrollLeft=l-20; else if(r>tabsEl.scrollLeft+tabsEl.clientWidth) tabsEl.scrollLeft=r-tabsEl.clientWidth+20; }
}
let dragX=null, dragS=0, dragged=false;
tabsEl.addEventListener("click",e=>{ if(dragged){dragged=false;return;} const b=e.target.closest(".tab"); if(b) goTo(+b.dataset.i); });
$("tPrev").addEventListener("click",()=>{ tabsEl.scrollLeft-=150; });
$("tNext").addEventListener("click",()=>{ tabsEl.scrollLeft+=150; });
tabsEl.addEventListener("wheel",e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ tabsEl.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
tabsEl.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse") return; dragX=e.clientX; dragS=tabsEl.scrollLeft; dragged=false; });
window.addEventListener("pointermove",e=>{ if(dragX===null) return; const d=e.clientX-dragX; if(Math.abs(d)>5) dragged=true; if(dragged){ tabsEl.style.scrollBehavior="auto"; tabsEl.scrollLeft=dragS-d; } });
window.addEventListener("pointerup",()=>{ dragX=null; tabsEl.style.scrollBehavior=""; });

function goTo(i,opts){
  opts=opts||{};
  if(run&&!opts.keepRun){ run=null; unlockScreen(); duck(false); }
  cur=i; T.hint=""; T.act="none";
  if(TRACK){ try{ gtag("event","page_view",{page_title:SHEETS[i], page_location:location.origin+location.pathname+"#sheet-"+(i+1)}); }catch(e){} }
  if(i<FIRST_MOVE) T.n=(i===5)?0:1;
  else if(i<CHECK_SHEET) T.n=1-(i-FIRST_MOVE)/5;
  else T.n=0;
  const r=RENDER[i<FIRST_MOVE?PAGES[i]:(i<CHECK_SHEET?"move":(i===CHECK_SHEET?"check":"done"))];
  r(i);
  gridWrap.scrollTop=0;
  renderTabs(); snapTurtle();
}

   [cell("출처",{c:"lbl"}),cell(m.basis,{s:5,c:"small"})]
  ],16);
  setBar("C3",m.formula);
  if(m.key==="blade"){ const h=$("tHint"); if(h){ h.setAttribute("x","84"); h.setAttribute("y","16"); h.setAttribute("font-size","14"); } }
  if(m.key==="roll"){ const h=$("tHint"); if(h) h.setAttribute("x","212"); }
  if(run&&run.mi===mi){ setControls(); }
  else { idleControls(mi); setStatus("준비"); }
 },
 check(){
  // (자가체크 시트)
  T.n=0;
  const Q=["턱 당기기: 고개를 숙이지 않고 턱을 뒤로 당겼나요?","목 늘리기: 가볍게 늘어나는 느낌까지만 했나요?","날개뼈 모으기: 어깨가 귀 쪽으로 올라가지 않았나요?","목 돌리기: 빠르지 않게 천천히 돌렸나요?","아프거나 저린 곳 없이 끝냈나요?"];
  const sel=(id,opts,label)=>'<select class="dd" autocomplete="off" id="'+id+'" aria-label="'+label+'"><option value="">선택</option>'+opts.map(o=>"<option>"+o+"</option>").join("")+"</select>";
  gridWrap.innerHTML=sheetHTML([
   [cell("잘 했나요?",{s:6,c:"ttl"})],
   [cell("오늘 스트레칭을 돌아보며 E열에서 골라 보세요.",{s:6,c:"sub"})],
   [cell("번호",{c:"hdr"}),cell("스스로 체크",{s:3,c:"hdr"}),cell("응답",{s:2,c:"hdr"})],
   ...Q.map((q,i)=>[cell(String(i+1),{c:"num"}),cell(q,{s:3}),cell(sel("c"+i,["예","아니오"],"체크 "+(i+1)+" 응답"),{s:2})]),
   [cell("지금 목·어깨 느낌",{s:4,c:"lbl"}),cell(sel("feel",["개운해요","그대로예요","불편해요"],"지금 목과 어깨 느낌"),{s:2})],
   [cell("잘한 항목",{s:2,c:"lbl"}),cell('<span class="chip none" id="cRes">응답을 골라 주세요</span>',{s:4,id:"cResCell"})],
   [cell("",{s:6,c:"small",id:"cAdv"})],
   [cell('<button class="btn sub" type="button" data-go="'+FIRST_MOVE+'">◀ 동작 다시 보기</button>',{s:3,c:"btncell"}),cell('<button class="btn" type="button" id="toDone">완료 보기 ▶</button>',{s:3,c:"btncell"})]
  ],18);
  const upd=()=>{
    const v=Q.map((_,i)=>$("c"+i).value), yes=v.filter(x=>x==="예").length, ans=v.filter(Boolean).length, feel=$("feel").value;
    const r=$("cRes");
    if(!ans){ r.className="chip none"; r.textContent="응답을 골라 주세요"; }
    else if(yes===5){ r.className="chip ok"; r.textContent="5 / 5 완벽해요!"; }
    else if(yes>=3){ r.className="chip ok"; r.textContent=yes+" / 5 잘했어요!"; }
    else { r.className="chip warn"; r.textContent=yes+" / 5 다음엔 핵심을 다시 봐요"; }
    $("cResCell").classList.add("sel");
    const warn=v[4]==="아니오"||feel==="불편해요";
    $("cAdv").textContent=warn?"무리하지 말고 쉬어요. 아프거나 저린 느낌이 계속되면 전문가와 상담하세요.":(feel==="개운해요"?"좋아요! 30~40분 뒤에 또 해 봐요.":"");
    setBar("C10",'=COUNTIF(E4:E8,"예") → '+yes+"개");
    updateRec(curRec,{score:ans?yes:null, feel:feel});
  };
  Q.forEach((_,i)=>$("c"+i).addEventListener("change",upd)); $("feel").addEventListener("change",upd);
  $("toDone").addEventListener("click",()=>{ track("selfcheck-done","자가체크 완료"); goTo(DONE_SHEET); if(doneMoves.size){ sfx("fanfare"); buzz(); } });
  setBar("E4",'=COUNTIF(E4:E8,"예")'); setStatus("자가체크");
 },
 done(){
  T.n=0; T.act="upright";
  const art='<g opacity=".55"><circle cx="222" cy="92" r="25" fill="none" stroke="#7D8A84" stroke-width="2.2" stroke-dasharray="5 4"/>'
   +'<text x="222" y="97" text-anchor="middle" font-size="11" font-weight="700" fill="#5F6B66">거북목</text></g>'
   +'<path d="M236 64 Q236 38 212 36" fill="none" stroke="#1F3A68" stroke-width="2.4" stroke-linecap="round"/>'
   +'<polygon points="206,36 215,30 215,42" fill="#1F3A68"/>'
   +'<line x1="167" y1="14" x2="167" y2="134" stroke="#1F3A68" stroke-width="2" stroke-dasharray="5 4"/>'
   +'<text x="167" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#1F3A68">귀·어깨 일직선</text>'
   +'<path d="M206 14 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#E8B931"/>'
   +'<path d="M140 30 l1.8 4.2 4.2 1.8 -4.2 1.8 -1.8 4.2 -1.8 -4.2 -4.2 -1.8 4.2 -1.8z" fill="#E8B931"/>';
  const sec=Math.max(0,Math.round((Date.now()-sessionStart)/1000));
  const d=new Date(), ds=(d.getMonth()+1)+"."+d.getDate();
  gridWrap.innerHTML=sheetHTML([
   [cell("탈출 성공!",{s:6,c:"ttl"})],
   [cell(doneMsg(),{s:6})],
   [cell('<div class="chartbox"><div class="ctitle">차트 10 · 거북목 탈출</div>'+turtleSVG(art)+'<div class="cap">귀와 어깨가 일직선! 거북목에서 탈출했어요</div><div class="stamp">탈출<br>성공<small>'+ds+'</small></div></div>',{s:6,c:"chart"})],
   [cell("한 동작",{s:2,c:"lbl"}),cell(doneMoves.size+"가지 / 5가지",{s:4,c:"num"})],
   [cell("걸린 시간",{s:2,c:"lbl"}),cell(sessionStart?Math.floor(sec/60)+"분 "+(sec%60)+"초":"-",{s:4,c:"num sel"})],
   [cell("30~40분 뒤에 또 만나요. 그 사이에도 자리에서 목을 가볍게 돌려 주세요.",{s:6})],
   [cell('<button class="btn" type="button" id="again">한 번 더 하기</button>',{s:3,c:"btncell"}),cell('<button class="btn sub" type="button" data-go="0">처음으로</button>',{s:3,c:"btncell"})],
   [cell(SRC,{s:6,c:"small"})]
  ],16);
  $("again").addEventListener("click",startStretching);
  setBar("C4","=SUM(오늘의스트레칭) → 탈출 성공"); setStatus("완료");
 }
};

gridWrap.addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) goTo(+b.dataset.go); });

/* 스와이프로 시트 넘기기 (설명 시트만) */
let sx=0, sy=0;
gridWrap.addEventListener("touchstart",e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; },{passive:true});
gridWrap.addEventListener("touchend",e=>{
  if(cur>=FIRST_MOVE) return;
  const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dy)<50){ if(dx<0&&cur<FIRST_MOVE-1) goTo(cur+1); else if(dx>0&&cur>0) goTo(cur-1); }
},{passive:true});

/* ===== 스트레칭 진행 ===== */
function phasesFor(m){
  const p=[{type:"prep",dur:5}];
  if(m.roll){ p.push({type:"roll",dir:1,dur:m.reps*m.per}); p.push({type:"switch",dur:3}); p.push({type:"roll",dir:-1,dur:m.reps*m.per}); }
  else for(let s=1;s<=m.sets;s++){ if(s>1) p.push({type:"rest",dur:5}); p.push({type:"hold",dur:m.hold,set:s}); }
  return p;
}
function startStretching(){
  track("stretch-start","스트레칭 시작");
  doneMoves=new Set(); sessionStart=Date.now(); curRec=null; lastAward=null; lockScreen();
  if(soundOn&&ctx){ try{ctx.resume()}catch(e){} }
  startMove(0);
}
function startMove(mi){
  run={mi:mi, phases:phasesFor(MOVES[mi]), pi:-1, running:true, remain:0, lastSec:null, lastRep:0};
  goTo(FIRST_MOVE+mi,{keepRun:true});
  if(!sessionStart) sessionStart=Date.now();
  lockScreen(); nextPhase(); setControls();
}
function idleControls(mi){
  const c=$("ctrl"); if(!c) return;
  c.innerHTML='<button class="btn" type="button" id="cStart">▶ 이 동작부터 시작</button>';
  $("cStart").addEventListener("click",()=>{ if(!sessionStart||!doneMoves.size) sessionStart=Date.now(); startMove(mi); });
}
function setControls(){
  const c=$("ctrl"); if(!c||!run) return;
  if(run.finished){
    const mi=run.mi, last=mi===MOVES.length-1;
    c.innerHTML='<button class="btn sub" type="button" id="cAgain">↻ 다시 하기</button><button class="btn" type="button" id="cNext">'+(last?"자가체크 ▶":"다음 동작 ▶")+'</button>';
    $("cAgain").addEventListener("click",()=>startMove(mi));
    $("cNext").addEventListener("click",()=>advance(mi));
    setStatus("완료 · 다음을 눌러 주세요");
    return;
  }
  c.innerHTML='<button class="btn sub" type="button" id="cPause">'+(run.running?"일시정지":"계속하기")+'</button><button class="btn sub" type="button" id="cSkip">건너뛰기 ▶</button>';
  $("cPause").addEventListener("click",togglePause);
  $("cSkip").addEventListener("click",()=>{ if(run) moveDone(true); });
  setStatus(run.running?"진행 중":"일시정지");
}
function togglePause(){ if(!run) return; run.running=!run.running; duck(!run.running); if(run.running) lockScreen(); setControls(); }
function note(msg){ const n=$("note"); if(!n) return; n.textContent=msg; n.classList.remove("pop"); void n.offsetWidth; n.classList.add("pop"); }

function nextPhase(){
  run.pi++;
  if(run.pi>=run.phases.length){ finishMove(); return; }
  const ph=run.phases[run.pi], m=MOVES[run.mi];
  run.remain=ph.dur; run.lastSec=null; run.lastRep=0;
  T.hint="";
  if(ph.type==="prep"){ T.act="none"; note("다음은 "+m.name+"! 준비~"); }
  if(ph.type==="rest"){ T.act="none"; note("잘했어요! 잠깐 쉬고 한 번 더!"); }
  if(ph.type==="switch"){ T.act="none"; note("이번엔 반대 방향으로!"); }
  if(ph.type==="hold"){ T.act=m.key; T.hint=m.hint; note("천천히, 가볍게~"); }
  if(ph.type==="roll"){ T.act="roll"; T.rollAngle=0; setRollArrow(ph.dir); T.hint=ph.dir>0?"↻ 시계 방향":"↺ 반시계 방향"; note("천천히 크게 원을 그려요"); }
  if(ph.type==="done"){ T.act="none"; T.n=1-(run.mi+1)/5; note("다 왔어요!"); }
  paintPhase(true);
}
function advance(mi){
  if(mi<MOVES.length-1){ startMove(mi+1); }
  else{ run=null; unlockScreen(); duck(false); curRec=(doneMoves.size===MOVES.length)?recordSession():null;
    if(doneMoves.size===MOVES.length){ track("stretch-complete","5동작 완료"); const b=timeBucket(Date.now()-sessionStart); track(b,BUCKET_TITLE[b]); }
    goTo(CHECK_SHEET); }
}
function moveDone(skipped){ const mi=run.mi; if(!skipped) doneMoves.add(mi); advance(mi); }
function finishMove(){
  const mi=run.mi, last=mi===MOVES.length-1;
  doneMoves.add(mi); run.finished=true; run.running=false;
  T.act="none"; T.hint="잘했어요!"; T.n=1-(mi+1)/5;
  const cnt=$("cntIn"), st=$("st"), bar=$("bar");
  if(cnt) cnt.innerHTML='<span class="big txt">다 왔어요!</span>';
  if(st) st.textContent="완료";
  if(bar){ bar.className="bar"; bar.style.width="0%"; }
  note(last?"모두 끝! 준비되면 ‘자가체크’를 눌러요":"준비되면 ‘다음 동작’을 눌러요");
  renderTabs(); setControls();
}
const HOLD_MSG={22:"숨 참지 말고 후~",15:"절반 왔어요!",5:"5초 남았어요!"};
function paintPhase(force){
  const ph=run.phases[run.pi], m=MOVES[run.mi];
  const cnt=$("cntIn"), st=$("st"), bar=$("bar"); if(!cnt) return;
  const sec=Math.max(0,Math.ceil(run.remain-1e-6));
  const elapsed=ph.dur-run.remain;
  if(ph.type==="roll"){
    const rep=Math.min(m.reps,Math.floor(elapsed/m.per)+1);
    T.rollAngle=ph.dir*(elapsed/m.per)*Math.PI*2;
    if(force||rep!==run.lastRep){
      if(!force&&rep>run.lastRep) sfx("soft");
      run.lastRep=rep;
      cnt.innerHTML='<span class="big">'+rep+'</span><span class="unit">/ '+m.reps+'회</span>';
      st.textContent=ph.dir>0?"↻ 시계 방향":"↺ 반시계 방향";
    }
    bar.className="bar"; bar.style.width=(100*run.remain/ph.dur)+"%";
    return;
  }
  if(!force&&sec===run.lastSec) return;
  run.lastSec=sec;
  if(ph.type==="hold"){
    cnt.innerHTML='<span class="big">'+sec+'</span><span class="unit">초</span>';
    st.textContent=m.sets>1?ph.set+"회차 / "+m.sets+"회":"유지하기";
    bar.className="bar"; bar.style.width=(100*run.remain/ph.dur)+"%";
    if(!force){ if(sec<=3&&sec>=1) sfx("tick"); if(HOLD_MSG[sec]) note(HOLD_MSG[sec]); }
  }else if(ph.type==="done"){
    cnt.innerHTML='<span class="big txt">다 왔어요!</span>';
    st.textContent="완료"; bar.className="bar"; bar.style.width="0%";
  }else{
    cnt.innerHTML='<span class="big prep">'+sec+'</span>';
    st.textContent=ph.type==="prep"?"준비":ph.type==="rest"?"쉬는 시간":"방향 바꾸기";
    bar.className="bar grey"; bar.style.width=(100*run.remain/ph.dur)+"%";
  }
}
function phaseEnd(ph){
  if(ph.type==="hold"||ph.type==="roll"){ sfx("ding"); buzz(); }
}

/* ===== 메인 루프 ===== */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.25,(now-last)/1000); last=now;
  if(run&&run.running&&cur===FIRST_MOVE+run.mi){
    const ph=run.phases[run.pi];
    run.remain-=dt;
    if(run.remain<=0){ phaseEnd(ph); nextPhase(); }
    else paintPhase(false);
  }
  drawTurtle(dt);
  requestAnimationFrame(loop);
}

paintSound();
function home(){ run=null; unlockScreen(); try{ if(location.hash) history.replaceState(null,"",location.pathname+location.search); }catch(e){} window.scrollTo(0,0); goTo(0); tabsEl.scrollLeft=0; }
home();
try{ if(storageOK&&loadLog().length) track("returning-user","기록 있는 사용자 재방문"); }catch(e){}
window.addEventListener("pageshow",e=>{ if(e.persisted) home(); });
if(wideMQ){ const onW=e=>{ WIDE=e.matches; if(!run) goTo(cur); }; if(wideMQ.addEventListener) wideMQ.addEventListener("change",onW); else if(wideMQ.addListener) wideMQ.addListener(onW); }
requestAnimationFrame(loop);
})();
</script>
